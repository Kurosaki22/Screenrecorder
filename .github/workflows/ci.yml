name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Integration tests need a real desktop and audio device, which hosted runners lack.
      - name: Test
        run: dotnet test --configuration Release --filter "Category!=Integration"

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          dotnet publish src/Screenrecorder -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$($tag.TrimStart('v')) -o dist

          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-build
          $ffmpeg = (Get-ChildItem ffmpeg-build -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName

          # Keep the product sellable: refuse GPL builds, require the encoders we rely on.
          $version = & $ffmpeg -hide_banner -version | Out-String
          if ($version -match 'enable-gpl') { throw 'ffmpeg build is GPL-licensed' }
          $encoders = & $ffmpeg -hide_banner -encoders | Out-String
          foreach ($e in 'libopus', 'h264_nvenc', 'hevc_nvenc', 'av1_nvenc', 'h264_mf') {
            if ($encoders -notmatch "\b$e\b") { throw "ffmpeg build lacks $e" }
          }

          Copy-Item $ffmpeg dist/
          $version | Set-Content dist/FFMPEG-VERSION.txt -Encoding utf8
          $license = Get-ChildItem ffmpeg-build -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName dist/FFMPEG-LICENSE.txt }
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md dist/
          Remove-Item dist/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive dist/* "Screenrecorder-$tag-win-x64.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes "Screenrecorder-${{ github.ref_name }}-win-x64.zip"
